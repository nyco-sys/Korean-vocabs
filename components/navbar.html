
<!-- Universal sidebar trigger: logo opens the sidebar on desktop and mobile. -->
<button class="sidebar-logo-trigger" id="sidebar-logo-trigger" type="button"
        aria-label="Open sidebar" aria-expanded="false" aria-controls="app-sidebar">
  <span class="sidebar-trigger-logo">한</span>
  <span class="sidebar-trigger-tooltip">Open sidebar</span>
</button>

<aside class="app-sidebar" id="app-sidebar" aria-label="Main sidebar">
  <div class="sidebar-top">
    <div class="brand">
      <div class="brand-logo">한</div>
      <div class="brand-copy">
        <h1>Korean Speller</h1>
        <span>Learn • Practice • Improve</span>
      </div>
    </div>
    <button class="sidebar-close" id="sidebar-close" type="button"
            aria-label="Close sidebar" title="Close sidebar">×</button>
  </div>

  <div class="sidebar-scroll" id="sidebar-scroll">
    <div class="sidebar-section-label">MAIN</div>
    <nav class="main-nav" id="main-navigation" aria-label="Main navigation">
    <button class="nav-btn auth-required-nav active" data-tab="statistics" onclick="switchTab('statistics')"><span class="nav-icon">▦</span><span class="nav-label">Dashboard</span></button>
    </nav>

    <div class="sidebar-section-label">LEARN</div>
    <nav class="main-nav" aria-label="Learning navigation">
    <button class="nav-btn auth-required-nav" data-tab="lessons" onclick="switchTab('lessons')"><span class="nav-icon">📘</span><span class="nav-label">Lessons</span></button>
    <button class="nav-btn auth-required-nav" data-tab="study" onclick="switchTab('study')"><span class="nav-icon">🖼️</span><span class="nav-label">Study Image</span></button>
    <button class="nav-btn auth-required-nav" data-tab="text-study" onclick="switchTab('text-study')"><span class="nav-icon">📝</span><span class="nav-label">Text Vocabs</span></button>
    <button class="nav-btn auth-required-nav" data-tab="listening" onclick="switchTab('listening')"><span class="nav-icon">🎧</span><span class="nav-label">Listening</span></button>
    <button class="nav-btn auth-required-nav" data-ai-nav data-tab="ai-tutor" onclick="switchTab('ai-tutor')"><span class="nav-icon">🤖</span><span class="nav-label">AI Tutor</span></button>
    <button class="nav-btn auth-required-nav" data-tab="speaking" onclick="switchTab('speaking')"><span class="nav-icon">🗣️</span><span class="nav-label">Speaking Partner</span></button>
    </nav>

    <div class="sidebar-section-label admin-nav-label" id="admin-section-label">ADMIN</div>
  <nav class="main-nav admin-nav" aria-label="Administration navigation">
    <button class="nav-btn admin-only-nav" data-tab="listening-admin" onclick="switchTab('listening-admin')"><span class="nav-icon">🎧</span><span class="nav-label">Listening Manager</span></button>
    <button class="nav-btn admin-only-nav" data-tab="users" onclick="switchTab('users')"><span class="nav-icon">👥</span><span class="nav-label">User Management</span></button>
    </nav>

    <div class="sidebar-section-label admin-nav-label" id="manage-section-label">MANAGE</div>
  <nav class="main-nav admin-nav" aria-label="Management navigation">
    <button class="nav-btn auth-required-nav" data-tab="add" onclick="switchTab('add')"><span class="nav-icon">➕</span><span class="nav-label">Add Image Vocab</span></button>
    <button class="nav-btn auth-required-nav" data-tab="text-add" onclick="switchTab('text-add')"><span class="nav-icon">➕</span><span class="nav-label">Add Text Vocab</span></button>
    <button class="nav-btn auth-required-nav" data-tab="manage" onclick="switchTab('manage')"><span class="nav-icon">⚙️</span><span class="nav-label">Manage Vocabs</span></button>
    <button class="nav-btn auth-required-nav" data-tab="review" onclick="switchTab('review')"><span class="nav-icon">🧠</span><span class="nav-label">Review Mistakes</span></button>
    </nav>

  </div>

  <div class="sidebar-account">
    <div class="sidebar-user-card" id="sidebar-user-card" hidden>
      <div class="sidebar-user-avatar" id="sidebar-user-avatar">U</div>
      <div class="sidebar-user-info">
        <strong id="sidebar-user-name">User</strong>
        <span id="sidebar-user-email">user@example.com</span>
        <span class="sidebar-user-role" id="sidebar-user-role">USER</span>
      </div>
    </div>
    <button class="nav-btn sidebar-account-btn login-nav-btn" id="login-nav-btn" onclick="openLoginModal()" type="button">
      <span class="nav-icon">↪</span><span class="nav-label">Sign In</span>
    </button>
    <button class="nav-btn sidebar-account-btn logout-nav-btn" id="logout-nav-btn" hidden onclick="openLogoutModal()" type="button">
      <span class="nav-icon logout-icon">↪</span><span class="nav-label">Logout</span>
    </button>
  </div>
</aside>

<div class="sidebar-backdrop" id="sidebar-backdrop"></div>

<div class="logout-modal" id="logout-modal" aria-hidden="true">
  <div class="logout-dialog" role="dialog" aria-modal="true" aria-labelledby="logout-title">
    <button class="logout-modal-close" type="button" onclick="closeLogoutModal()" aria-label="Close">×</button>
    <div class="logout-dialog-icon">↪</div>
    <span class="eyebrow">ACCOUNT</span>
    <h3 id="logout-title">Log out?</h3>
    <p>Are you sure you want to sign out of your account?</p>
    <div class="logout-actions">
      <button class="logout-confirm" type="button" onclick="confirmLogout()">Yes, Logout <span>↪</span></button>
      <button class="logout-cancel" type="button" onclick="closeLogoutModal()">Cancel</button>
    </div>
  </div>
</div>
