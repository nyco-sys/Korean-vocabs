<div aria-hidden="true" class="edit-modal" id="login-modal">
<div class="edit-modal-backdrop" onclick="closeLoginModal()"></div>
<div aria-labelledby="login-modal-title" aria-modal="true" class="edit-modal-card" role="dialog">
<div class="edit-modal-header">
<div>
<h2 id="login-modal-title">Admin Login</h2>
<p style="color:var(--text-muted);margin:6px 0 0;">Sign in to manage your vocabulary.</p>
</div>
<button class="edit-close" onclick="closeLoginModal()" type="button">✕</button>
</div>
<form id="admin-login-form" onsubmit="loginAdmin(event)">
<div class="form-group">
<label for="admin-email">Email</label>
<input autocomplete="username" class="form-control" id="admin-email" required="" type="email"/>
</div>
<div class="form-group">
<label for="admin-password">Password</label>
<input autocomplete="current-password" class="form-control" id="admin-password" required="" type="password"/>
</div>
<div id="login-error" role="alert" style="color:#b42318;min-height:1.4rem;margin-bottom:.75rem;"></div>
<div style="display:flex;gap:.75rem;justify-content:flex-end;flex-wrap:wrap;">
<button class="btn btn-secondary" onclick="closeLoginModal()" type="button">Cancel</button>
<button class="btn btn-submit" type="submit">Login</button>
</div>
</form>
</div>
</div>
