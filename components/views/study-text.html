<section class="view" id="text-study-view">
  <div class="dashboard-bar glass-panel" style="padding: 0.8rem 1.2rem">
    <select id="text-category-filter" onchange="filterTextVocab()">
      <option value="ALL">All Categories</option>
    </select>
    <select id="text-quiz-mode" onchange="setTextQuizMode(this.value)">
      <option value="typing">⌨️ Typing</option>
      <option value="multiple">🔘 Multiple Choice</option>
    </select>
    <button class="btn btn-secondary" onclick="triggerRandomTextMode()" style="flex: 0 0 auto">🔀 Randomize All</button>
  </div>
  <div class="glass-panel quiz-card text-quiz-card" id="text-quiz-wrapper">
    <div class="text-prompt-container">
      <span class="category-tag" id="text-card-cat">Category</span>
      <div class="text-prompt-label">English / Meaning</div>
      <div class="text-prompt" id="text-card-prompt">To go</div>
    </div>
    <div class="answer-box">
      <div id="text-typing-answer-area">
        <div class="input-wrapper">
          <input autocomplete="off" class="answer-input" id="text-user-input" placeholder="Type Korean..." type="text" />
        </div>
      </div>
      <div class="multiple-choice-options" id="text-multiple-choice" style="display: none"></div>
      <div class="feedback-message" id="text-feedback"></div>
    </div>
    <div class="action-row" id="text-typing-actions">
      <button class="btn btn-submit" onclick="checkTextAnswer()">Check Answer</button>
      <button class="btn btn-secondary" onclick="showTextAnswer()">Answer</button>
      <button class="btn btn-secondary" onclick="skipTextQuestion()">Skip</button>
    </div>
    <div class="keyboard-container" id="text-study-keyboard"></div>
  </div>
  <div class="glass-panel" id="text-empty-notice" style="display: none; text-align: center; padding: 3rem">
    <h3>No text vocabulary items found!</h3>
    <p style="color: var(--text-muted); margin-top: 8px">Add some text vocabulary or choose another category.</p>
  </div>
</section>
