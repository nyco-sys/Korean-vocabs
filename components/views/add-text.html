<section class="view auth-required-view" id="text-add-view">
<div class="glass-panel">
<h2 style="margin-bottom:1.5rem;">Add New Text Vocabulary</h2>
<form id="text-vocab-form" onsubmit="addTextVocabulary(event)">
<div class="form-group">
<label>Category</label>
<input class="form-control" id="text-input-category" placeholder="e.g. Verbs, Adjectives" required="" type="text"/>
</div>
<div class="form-group">
<label>English / Meaning</label>
<input class="form-control" id="text-input-english" placeholder="e.g. To go" required="" type="text"/>
</div>
<div class="form-group">
<label>Korean Word (Correct Answer)</label>
<input autocomplete="off" class="form-control" id="text-input-korean" placeholder="e.g. 가다" required="" type="text"/>
<div class="keyboard-container add-korean-keyboard" id="text-add-korean-keyboard"></div>
</div>
<button class="btn btn-submit" style="width:100%; padding:12px;" type="submit">Save Text Vocabulary</button>
</form>
</div>
</section>
